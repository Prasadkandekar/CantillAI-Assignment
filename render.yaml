# Render blueprint (prepared, not deployed). New -> Blueprint -> pick this repo, then set OPENROUTER_API_KEY.
databases:
  - name: corvo-db
    plan: free
    databaseName: corvo
    user: corvo

services:
  - type: web
    name: corvo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: corvo-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: CORS_ORIGINS
        value: https://corvo-frontend.onrender.com

  - type: web
    name: corvo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://corvo-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
